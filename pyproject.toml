[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personalsite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4.5.3",
    "jupyterlab-quarto>=0.3.5",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pdfplumber>=0.11.9",
    "plotly>=6.5.2",
    "polars>=1.39.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "scipy-stubs>=1.17.1.3",
]

[project.scripts]
gen-header = "scripts.generate_gem_mesh_svg:main"
gen-logo = "scripts.generate_logo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]
