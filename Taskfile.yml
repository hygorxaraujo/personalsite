version: '3'

tasks:
  dev:
    desc: Start live reload server
    cmds:
      - quarto preview

  build:
    desc: Render site to _site/ directory
    cmds:
      - quarto render

  clean:
    desc: Remove _site/ and _freeze/ folders
    cmds:
      - rm -rf _site/ _freeze/

  sync:
    desc: Sync python dependencies
    cmds:
      - uv sync

  new_post:
    desc: "Create a new post from template. Usage: task new_post TITLE="
    cmds:
      - uv run scripts/new_post.py "{{.TITLE}}"

  publish:
    desc: Publish the site to GitHub Pages
    deps:
      - build
    cmds:
      - quarto publish gh-pages
